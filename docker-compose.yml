services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cocos
      POSTGRES_PASSWORD: cocos
      POSTGRES_DB: cocos
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the data volume is empty (first start).
      - ./db/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cocos -d cocos']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
